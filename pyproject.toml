[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huolala-figma-mcp"
version = "2.4.0"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# 生产环境依赖（锁定版本以保证环境可复现）
dependencies = [
    # HTTP Client for Figma API
    "requests==2.32.5",
    # Data Validation & Serialization
    "msgspec==0.18.6",
    # Config Management
    "python-dotenv==1.2.2",
    # Logging
    "structlog==25.5.0",
    # FastMCP - 快速 MCP 服务器框架
    "fastmcp==2.13.3",
    # Tree data structure
    "treelib==1.7.0",
    # Async HTTP (export service image download)
    "aiohttp==3.11.18",
    "numpy==1.26.4",
    "pillow==12.2.0",
    "scikit-image==0.21.0",
    "opencv-python==4.7.0.72",
    "ultralytics==8.2.0",
    "torch==2.2.2",
    "dill==0.3.7"
]

[project.optional-dependencies]
# 开发依赖
dev = [
    "black==24.4.2",
    "isort==5.13.2",
    "ipython==8.24.0",
]
# UI2Code 自动化对比测试（tests/ui2code_auto_test.py，需额外安装浏览器）
ui2code-test = [
    "playwright==1.57.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
